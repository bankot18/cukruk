# ==========================================================
# CLOUDFLARE PAGES / WORKERS CONFIGURATION - CEKAT
# File: CP WEB/wrangler.toml
# ==========================================================
name = "cekat-control-panel"
pages_build_output_dir = "."
compatibility_date = "2024-09-01"

# 1. Cloudflare D1 SQL Database Binding
[[d1_databases]]
binding = "DB"
database_name = "cekat_db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# 2. Cloudflare R2 Object Storage Binding (Arsip CSV & Laporan)
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cekat-storage"
