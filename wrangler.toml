# ==========================================================
# CLOUDFLARE WORKER & STATIC ASSETS CONFIGURATION
# Project: ENCO Control Panel (Entry CKG Otomatis)
# Deploy: Repo ini langsung di-deploy ke Cloudflare Pages
# ==========================================================
name = "cpenco"
main = "worker.js"
compatibility_date = "2024-09-01"

# Static Assets — folder "public" berisi index.html, style.css, app.js
[assets]
directory = "./public"
binding = "ASSETS"

# Binding Database Cloudflare D1 SQL
[[d1_databases]]
binding = "DB"
database_name = "enco_db"
database_id = "8815a9d2-4d81-4340-8415-8992229f3c07"

# Binding Object Storage Cloudflare R2
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "enco-storage"
